# 专用于服务器的最小配置；凭据由服务进程的环境注入。
plugins:
  http: {}
  personal-bot: {}
  inspect: {}
  adapter-qq:
    $if: env.QQ_APP_ID && env.QQ_APP_SECRET
    id: ${{ env.QQ_APP_ID }}
    secret: ${{ env.QQ_APP_SECRET }}
    type: public
    protocol: websocket
    intents: 33554432 # GROUP_AND_C2C_EVENT
    sandbox: ${{ env.QQ_SANDBOX === 'true' }}
